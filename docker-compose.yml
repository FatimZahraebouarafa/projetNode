services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: rabta
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rabta-network

  # Backend API
  backend:
    image: fatimzahraebouarafa/rabta-backend:${BACKEND_TAG:-latest}
    # Pour le développement local:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - backend.env
    depends_on:
      - mongodb
    networks:
      - rabta-network

  # Frontend React App
  frontend:
    image: fatimzahraebouarafa/rabta-frontend:${FRONTEND_TAG:-latest}
    # Pour le développement local:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - rabta-network

networks:
  rabta-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
