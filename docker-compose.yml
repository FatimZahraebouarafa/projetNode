services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: rabta-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: rabta
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rabta-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rabta-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - backend.env
    depends_on:
      - mongodb
    networks:
      - rabta-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rabta-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - rabta-network

networks:
  rabta-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
